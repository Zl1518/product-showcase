<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业产品展示与点单系统</title>
<link rel="stylesheet" href="/static/css/common.css">
<link rel="stylesheet" href="/static/css/store.css">
</head>
<body>

<!-- ========== 顶部导航栏 ========== -->
<nav class="navbar">
  <div class="container">
    <a href="/" class="brand">🏢 产品展示</a>

    <div class="flex-1"></div>

    <!-- 搜索框 -->
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="搜索产品名称或描述…" maxlength="200">
    </div>

    <!-- 用户身份 -->
    <button class="user-btn" id="user-btn" title="点击填写身份信息">
      👤 <span>登录/身份</span>
    </button>

    <!-- 购物车 -->
    <button class="btn btn-icon btn-ghost cart-btn" id="cart-btn" title="购物车">
      🛒
      <span class="cart-count" id="cart-count" style="display:none;">0</span>
    </button>
  </div>
</nav>

<!-- ========== 分类筛选栏 ========== -->
<div class="category-bar">
  <div class="container" id="category-bar">
    <button class="cat-tag active">全部</button>
  </div>
</div>

<!-- ========== 产品列表 ========== -->
<main class="products-section">
  <div class="container">
    <div class="product-grid" id="product-grid">
      <div class="loading-overlay">
        <div class="spinner"></div> 加载中…
      </div>
    </div>
  </div>
</main>

<!-- ========== 页脚 ========== -->
<footer style="text-align:center;padding:var(--space-lg);color:var(--text-muted);font-size:0.8125rem;">
  <p>企业产品展示与点单系统 · 管理端入口：<a href="/admin">/admin</a></p>
</footer>

<script src="/static/js/common.js"></script>
<script src="/static/js/store.js"></script>
</body>
</html>
